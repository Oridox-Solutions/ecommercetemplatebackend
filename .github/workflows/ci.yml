name: Backend CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow_check:
    name: Backend Workflow Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Lint
        run: npm run lint

      - name: ❌ Lint Failed
        if: failure()
        run: echo "Lint step failed. Fix lint errors before merging."

      - name: 🏗️ Build
        run: npm run build

      - name: ❌ Build Failed
        if: failure()
        run: echo "Build step failed. Check the build output above."

      - name: 🧪 Test
        run: npm test

      - name: ❌ Tests Failed
        if: failure()
        run: echo "Test step failed. Check the test output above."

      - name: ✅ Success
        if: success()
        run: echo "Backend Github Actions Workflow passed all checks."